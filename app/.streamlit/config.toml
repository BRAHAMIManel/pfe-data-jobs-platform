# Charte graphique « data / detection » : theme sombre, graphite + rouge signal (voir style.py).
[theme]
base = "dark"
primaryColor = "#E0182D"
backgroundColor = "#0E1014"
secondaryBackgroundColor = "#1A1D24"
textColor = "#EEF0F3"
font = "sans serif"

[server]
headless = true
maxUploadSize = 5   # Mo : largement assez pour un CV
# Ne pas surveiller les fichiers du code : sous Windows, le dossier app/ est
# partage avec Docker et la surveillance consomme du processeur en continu.
# Apres une modification du code : docker compose restart app
fileWatcherType = "none"
runOnSave = false

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false