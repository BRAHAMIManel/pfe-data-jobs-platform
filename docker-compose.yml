# Images figees par empreinte (sha256) : la version qui tourne est
# exactement celle qui a ete testee, et une mise a jour silencieuse de
# "latest" ne peut plus casser le projet ni introduire une faille.
# Pour mettre a jour : changer l'empreinte volontairement, puis retester.
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres-airflow:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
    PYTHONPATH: /opt/airflow/scripts

    # --- Securite Airflow : chiffrement des secrets et des sessions ---
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-}

    # --- MinIO (Data Lake) ---
    # Compte dedie au pipeline, limite a raw et silver (lecture/ecriture,
    # SANS suppression). Le compte root ne sert qu'a l'administration.
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY: ${MINIO_PIPELINE_USER}
    MINIO_SECRET_KEY: ${MINIO_PIPELINE_PASSWORD}
    MINIO_BUCKET_RAW: raw
    MINIO_BUCKET_SILVER: silver
    MINIO_BUCKET_GOLD: gold

    # --- API France Travail ---
    FRANCE_TRAVAIL_CLIENT_ID: ${FRANCE_TRAVAIL_CLIENT_ID}
    FRANCE_TRAVAIL_CLIENT_SECRET: ${FRANCE_TRAVAIL_CLIENT_SECRET}

    # --- Entrepot (schema en etoile) ---
    DWH_HOST: postgres-dwh
    DWH_PORT: 5432
    DWH_DB: ${DWH_DB}
    DWH_USER: ${DWH_USER}
    DWH_PASSWORD: ${DWH_PASSWORD}
    # Compte en lecture seule cree pour l'application (dwh.creer_role_lecture)
    APP_DWH_USER: ${APP_DWH_USER:-app_lecture}
    APP_DWH_PASSWORD: ${APP_DWH_PASSWORD}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - ./scripts:/opt/airflow/scripts
    - ./dbt:/opt/airflow/dbt
  user: "${AIRFLOW_UID:-50000}:0"
  networks:
    - pfe-net
  depends_on:
    postgres-airflow:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully

services:
  # -------------------------------------------------------------
  # Metabase technique d'Airflow (ne PAS y mettre les donnees metier)
  # -------------------------------------------------------------
  postgres-airflow:
    image: postgres:15@sha256:9b1d34adbce1dd07ee6e94b4a2cf698884b89bd44a6c9c12f5da8f3acbfe4957
    container_name: pfe-postgres-airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - pfe-net

  # -------------------------------------------------------------
  # Entrepot de donnees : schema en etoile (dim_* / fait_*)
  # -------------------------------------------------------------
  postgres-dwh:
    image: postgres:15@sha256:9b1d34adbce1dd07ee6e94b4a2cf698884b89bd44a6c9c12f5da8f3acbfe4957
    container_name: pfe-postgres-dwh
    environment:
      POSTGRES_USER: ${DWH_USER}
      POSTGRES_PASSWORD: ${DWH_PASSWORD}
      POSTGRES_DB: ${DWH_DB}
    ports:
      # 127.0.0.1 : joignable depuis CE PC seulement (DBeaver), jamais
      # depuis le reseau (Wi-Fi public, bibliotheque...).
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-dwh-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DWH_USER} -d ${DWH_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - pfe-net

  # -------------------------------------------------------------
  # Data Lake S3-compatible
  # Console web : http://localhost:9001
  # -------------------------------------------------------------
  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: pfe-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - pfe-net

  # Cree les 3 buckets de l'architecture medallion, puis le compte du
  # pipeline avec sa politique de droits (securite/minio_pipeline_policy.json),
  # puis s'arrete. Rejouable sans effet de bord.
  minio-init:
    image: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    container_name: pfe-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/raw &&
      mc mb --ignore-existing local/silver &&
      mc mb --ignore-existing local/gold &&
      echo '--- buckets raw / silver / gold prets ---' &&
      (mc admin policy create local pipeline /securite/minio_pipeline_policy.json || true) &&
      mc admin policy info local pipeline > /dev/null &&
      mc admin user add local $${MINIO_PIPELINE_USER} $${MINIO_PIPELINE_PASSWORD} &&
      (mc admin policy attach local pipeline --user $${MINIO_PIPELINE_USER} || true) &&
      echo '--- compte pipeline pret : raw et silver, sans suppression ---' &&
      exit 0
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PIPELINE_USER: ${MINIO_PIPELINE_USER}
      MINIO_PIPELINE_PASSWORD: ${MINIO_PIPELINE_PASSWORD}
    volumes:
      - ./securite:/securite:ro
    networks:
      - pfe-net

  # -------------------------------------------------------------
  # Airflow : init (migration + compte admin), scheduler, webserver
  # Interface : http://localhost:8080
  # -------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    container_name: pfe-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER}" \
          --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname Manel --lastname Brahami \
          --role Admin --email admin@pfe.local || true
    restart: on-failure

  airflow-scheduler:
    <<: *airflow-common
    container_name: pfe-airflow-scheduler
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-webserver:
    <<: *airflow-common
    container_name: pfe-airflow-webserver
    command: webserver
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # -------------------------------------------------------------
  # Application de restitution (Streamlit)
  # Interface : http://localhost:8501
  # -------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: pfe-app
    environment:
      DWH_HOST: postgres-dwh
      DWH_PORT: 5432
      DWH_DB: ${DWH_DB}
      # Compte en LECTURE SEULE : l'application ne peut rien modifier.
      DWH_USER: ${APP_DWH_USER:-app_lecture}
      DWH_PASSWORD: ${APP_DWH_PASSWORD}
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./app:/app:ro
      # Lecture du CV et dictionnaire de competences partages avec Airflow
      - ./scripts:/scripts:ro
    restart: unless-stopped
    networks:
      - pfe-net
    depends_on:
      postgres-dwh:
        condition: service_healthy

volumes:
  postgres-airflow-data:
  postgres-dwh-data:
  minio-data:

networks:
  pfe-net:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "1400"